name: Deploy Frontend

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente de Deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - hom
          - prd
      branch:
        description: 'Branch para deploy'
        required: true
        default: 'main'
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: tem-na-festa-frontend-${{ github.event.inputs.environment }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Update Swarm Service
        run: |
          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Name,Values=tem-na-festa-frontend-1a (Manager)-${{ github.event.inputs.environment }}" \
            --parameters 'commands=["docker service update --image ${{ steps.login-ecr.outputs.registry }}/tem-na-festa-frontend-${{ github.event.inputs.environment }}:${{ github.sha }} temnafesta_frontend"]' \
            --region us-east-1
